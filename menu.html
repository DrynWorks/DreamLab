<!DOCTYPE html>
<html lang="pt-BR" data-theme="black">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="DreamLab — página pessoal de Dryn.">
  <meta name="author" content="DrynWorks">
  <title>DreamLab — Home</title>
  <link rel="stylesheet" href="style.css">
  <script src="js/theme.js"></script>
  <script src="js/nav.js"></script>
  <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.5.1/jquery.min.js"></script>
</head>

<body data-page="home">

  <div id="loading-bar"></div>
  <div class="desktop-bg"></div>

  <div class="floating-logo page-logo">
    <div class="logo-dream" role="img" aria-label="Dream"></div>
    <div class="logo-lab" role="img" aria-label="Lab"></div>
  </div>

  <div class="outer-window">

    <div class="outer-titlebar">
      <span class="outer-titlebar-title">DreamLab — Home</span>
      <div class="win98-titlebar-controls">
        <button aria-label="Minimize"></button>
        <button aria-label="Maximize"></button>
        <button aria-label="Close"></button>
      </div>
    </div>

    <div class="outer-body">

      <div class="marquee-bar">
        <div class="marquee-content">
          ART <span class="sep">·</span> MUSIC <span class="sep">·</span> CODE <span class="sep">·</span> SKATE <span class="sep">·</span> WEB <span class="sep">·</span>
          ART <span class="sep">·</span> MUSIC <span class="sep">·</span> CODE <span class="sep">·</span> SKATE <span class="sep">·</span> WEB <span class="sep">·</span>
        </div>
      </div>

      <div class="site-columns">

        <!-- Sidebar -->
        <div class="site-sidebar">

          <div class="window profile-card" style="animation-delay: 0.04s;">
            <div class="window-header">
              <span class="window-title">Profile</span>
            </div>
            <div class="window-body">
              <div class="profile-avatar">
                <img src="images/download.jfif" alt="Dryn" class="profile-photo">
              </div>
              <div class="profile-name">Dryn</div>
              <div class="profile-status">
                <span class="status-dot"></span> online
              </div>
              <div class="profile-feeling">
                <div class="profile-status-label">mood</div>
                <a href="https://www.imood.com/users/dryn" target="_blank" rel="noopener"><img
                    src="https://moods.imood.com/display/uname-dryn/imood.gif" alt="mood" class="imood-badge"></a>
              </div>
            </div>
          </div>

          <div class="window" style="animation-delay: 0.08s;">
            <div class="window-header">
              <span class="window-title">Menu</span>
            </div>
            <div class="window-body" style="padding: 6px;" data-nav></div>
          </div>

          <div class="window" style="animation-delay: 0.12s;">
            <div class="window-header">
              <span class="window-title">Theme</span>
            </div>
            <div class="window-body" style="padding: 6px;">
              <div data-theme-switcher></div>
            </div>
          </div>

          <div class="window music-player" id="music-player" style="animation-delay: 0.16s;">
            <div class="win98-titlebar">
              <div class="win98-titlebar-text">
                <img src="https://files.catbox.moe/tg55zp.png" alt=""> Player
              </div>
              <div class="win98-titlebar-controls">
                <button aria-label="Minimize"></button>
                <button aria-label="Maximize"></button>
                <button aria-label="Close"></button>
              </div>
            </div>
            <div class="win98-iframe-body">
              <iframe width="100%" height="152"
                src="https://www.youtube.com/embed/videoseries?list=PLjc7AFgJy25b03aCRT9rmCzUTGHx1Hnlt"
                title="Player" frameborder="0" allowfullscreen></iframe>
            </div>
          </div>

        </div><!-- /site-sidebar -->

        <!-- Main -->
        <div class="site-main">

          <div class="window content-frame" style="animation-delay: 0.06s;">
            <div class="window-header">
              <span class="window-title">Viewer</span>
            </div>
            <div class="content-frame-body">
              <iframe name="dreamlab-content" src="pages/home.html" title="Conteúdo do DreamLab"
                class="content-iframe"></iframe>
            </div>
          </div>

        </div><!-- /site-main -->

      </div><!-- /site-columns -->

      <!-- Shoutbox flutuante — fora do fluxo do conteúdo principal -->
      <div class="window shoutbox-float" id="shoutbox-window">
        <div class="win98-titlebar shoutbox-titlebar">
          <div class="win98-titlebar-text">SMS</div>
          <button type="button" class="win95-btn shoutbox-toggle" id="shoutbox-toggle"
            aria-label="Minimizar Shoutbox" aria-expanded="true" aria-controls="shoutbox-body">_</button>
        </div>
        <div class="shoutbox-body" id="shoutbox-body">
          <iframe src="https://dryn.ishoutbox.com" title="DreamLab Shoutbox" width="100%" height="450"
            frameborder="0" scrolling="no" allowtransparency="true"></iframe>
        </div>
      </div>

      <footer class="site-footer">
        <div class="footer-text">@ DrynWorks</div>
      </footer>

    </div><!-- /outer-body -->

  </div><!-- /outer-window -->

  <script src="js/sakura.js"></script>
  <script src="js/shoutbox.js"></script>

</body>

</html>

<!DOCTYPE html>
<html lang="pt-BR" data-theme="black">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Links recomendados por Dryn.">
  <meta name="author" content="DrynWorks">
  <title>DreamLab — Links</title>
  <link rel="stylesheet" href="../style.css">
  <script src="../js/theme.js"></script>
</head>

<body class="frame-body">

  <div class="page-head" style="animation-delay: 0.04s;">
    <span class="page-title">LINKS</span>
  </div>

  <div class="links-page-container">

    <div class="window link-group" style="animation-delay: 0.08s;">
      <div class="window-header">
        <span class="window-title">My Links</span>
      </div>
      <div class="link-group-body">
        <a href="https://github.com/DrynWorks" target="_blank" rel="noopener" class="link-row">
          <div class="link-row-text">
            <div class="link-card-name">GitHub — DrynWorks</div>
            <div class="link-card-url">github.com/DrynWorks</div>
          </div>
          <span class="link-external-icon">&#8599;</span>
        </a>
      </div>
    </div>

    <div class="window link-group" style="animation-delay: 0.12s;">
      <div class="window-header">
        <span class="window-title">Music</span>
      </div>
      <div class="link-group-body">
        <a href="https://youtube.com/@dryn.k" target="_blank" rel="noopener" class="link-row">
          <div class="link-row-text">
            <div class="link-card-name">Minhas Playlists</div>
            <div class="link-card-url">youtube.com/@dryn.k</div>
          </div>
          <span class="link-external-icon">&#8599;</span>
        </a>
        <a href="https://mydora.restorativland.org/" target="_blank" rel="noopener" class="link-row">
          <div class="link-row-text">
            <div class="link-card-name">MyDora</div>
            <div class="link-card-url">mydora.restorativland.org</div>
            <div class="link-card-desc">Player retrô de música.</div>
          </div>
          <span class="link-external-icon">&#8599;</span>
        </a>
      </div>
    </div>

    <div class="window link-group" style="animation-delay: 0.16s;">
      <div class="window-header">
        <span class="window-title">Other Sites</span>
      </div>
      <div class="link-group-body">
        <a href="https://howsoonisnow.org/" target="_blank" rel="noopener" class="link-row">
          <div class="link-row-text">
            <div class="link-card-name">How Soon Is Now?</div>
            <div class="link-card-url">howsoonisnow.org</div>
          </div>
          <span class="link-external-icon">&#8599;</span>
        </a>
      </div>
    </div>

    <div class="window link-group" style="animation-delay: 0.2s;">
      <div class="window-header">
        <span class="window-title">Buttons</span>
      </div>
      <div class="buttons-row">
        <div class="button-slot">88×31</div>
        <div class="button-slot">88×31</div>
      </div>
    </div>

  </div><!-- /links-page-container -->

</body>

</html>

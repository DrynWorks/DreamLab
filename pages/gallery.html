<!DOCTYPE html>
<html lang="pt-BR" data-theme="black">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Galeria de Dryn — desenhos, murais e artes digitais.">
  <meta name="author" content="DrynWorks">
  <title>DreamLab — Gallery</title>
  <link rel="stylesheet" href="../style.css">
  <script src="../js/theme.js"></script>
</head>

<body class="frame-body">

  <div class="page-head" style="animation-delay: 0.04s;">
    <span class="page-title">GALLERY</span>
  </div>

  <div class="artes-grid">

    <div class="window artes-card" style="animation-delay: 0.08s;" onclick="openLightbox(0)">
      <div class="window-header">
        <span class="window-title">mural</span>
        <span class="artes-zoom-icon">+</span>
      </div>
      <div class="artes-img-container">
        <img src="../images/IMG_3798.JPG" alt="Mural de Parede" loading="lazy">
        <div class="artes-overlay"><span>AMPLIAR</span></div>
      </div>
      <div class="artes-card-body">
        <div class="artes-card-title">Mural de Parede</div>
      </div>
    </div>

    <div class="window artes-card" style="animation-delay: 0.11s;" onclick="openLightbox(1)">
      <div class="window-header">
        <span class="window-title">cachorro</span>
        <span class="artes-zoom-icon">+</span>
      </div>
      <div class="artes-img-container">
        <img src="../images/IMG_3901.JPG" alt="Sede de Fila" loading="lazy">
        <div class="artes-overlay"><span>AMPLIAR</span></div>
      </div>
      <div class="artes-card-body">
        <div class="artes-card-title">Sede de Fila</div>
      </div>
    </div>

    <div class="window artes-card" style="animation-delay: 0.14s;" onclick="openLightbox(2)">
      <div class="window-header">
        <span class="window-title">raposa</span>
        <span class="artes-zoom-icon">+</span>
      </div>
      <div class="artes-img-container">
        <img src="../images/IMG_3902.JPG" alt="Espírito de Outono" loading="lazy">
        <div class="artes-overlay"><span>AMPLIAR</span></div>
      </div>
      <div class="artes-card-body">
        <div class="artes-card-title">Espírito de Outono</div>
      </div>
    </div>

    <div class="window artes-card" style="animation-delay: 0.17s;" onclick="openLightbox(3)">
      <div class="window-header">
        <span class="window-title">gatinho</span>
        <span class="artes-zoom-icon">+</span>
      </div>
      <div class="artes-img-container">
        <img src="../images/IMG_3903.JPG" alt="Brincadeira de Gato" loading="lazy">
        <div class="artes-overlay"><span>AMPLIAR</span></div>
      </div>
      <div class="artes-card-body">
        <div class="artes-card-title">Brincadeira de Gato</div>
      </div>
    </div>

    <div class="window artes-card" style="animation-delay: 0.2s;" onclick="openLightbox(4)">
      <div class="window-header">
        <span class="window-title">ceu</span>
        <span class="artes-zoom-icon">+</span>
      </div>
      <div class="artes-img-container">
        <img src="../images/IMG_3904.JPG" alt="Olhando pro Céu" loading="lazy">
        <div class="artes-overlay"><span>AMPLIAR</span></div>
      </div>
      <div class="artes-card-body">
        <div class="artes-card-title">Olhando pro Céu</div>
      </div>
    </div>

    <div class="window artes-card" style="animation-delay: 0.23s;" onclick="openLightbox(5)">
      <div class="window-header">
        <span class="window-title">caderno</span>
        <span class="artes-zoom-icon">+</span>
      </div>
      <div class="artes-img-container">
        <img src="../images/IMG_3905.JPG" alt="Olhar Selvagem" loading="lazy">
        <div class="artes-overlay"><span>AMPLIAR</span></div>
      </div>
      <div class="artes-card-body">
        <div class="artes-card-title">Olhar Selvagem</div>
      </div>
    </div>

    <div class="window artes-card" style="animation-delay: 0.26s;" onclick="openLightbox(6)">
      <div class="window-header">
        <span class="window-title">neon</span>
        <span class="artes-zoom-icon">+</span>
      </div>
      <div class="artes-img-container">
        <img src="../images/IMG_8368.jpg" alt="Neon e Kanji" loading="lazy">
        <div class="artes-overlay"><span>AMPLIAR</span></div>
      </div>
      <div class="artes-card-body">
        <div class="artes-card-title">Neon &amp; Kanji (神)</div>
      </div>
    </div>

  </div><!-- /artes-grid -->

  <!-- LIGHTBOX -->
  <div class="lightbox-modal" id="lightbox" onclick="closeLightbox(event)">
    <div class="lightbox-dialog window" onclick="event.stopPropagation()">
      <div class="window-header">
        <span class="window-title" id="lightbox-title">Viewer</span>
        <button type="button" class="lightbox-close-btn" onclick="closeLightbox(event)" aria-label="Fechar">CLOSE</button>
      </div>
      <div class="window-body lightbox-body">
        <div class="lightbox-img-wrapper">
          <img src="" id="lightbox-img" alt="">
        </div>
        <div class="lightbox-nav">
          <button type="button" class="lightbox-nav-btn" onclick="showPrev(event)">PREV</button>
          <button type="button" class="lightbox-nav-btn" onclick="showNext(event)">NEXT</button>
        </div>
      </div>
    </div>
  </div>

  <script>
    var ARTWORKS = [
      { src: '../images/IMG_3798.JPG', title: 'Mural de Parede' },
      { src: '../images/IMG_3901.JPG', title: 'Sede de Fila' },
      { src: '../images/IMG_3902.JPG', title: 'Espírito de Outono' },
      { src: '../images/IMG_3903.JPG', title: 'Brincadeira de Gato' },
      { src: '../images/IMG_3904.JPG', title: 'Olhando pro Céu' },
      { src: '../images/IMG_3905.JPG', title: 'Olhar Selvagem' },
      { src: '../images/IMG_8368.jpg', title: 'Neon & Kanji (神)' }
    ];

    var currentIndex = 0;

    function showArtwork(index) {
      currentIndex = (index + ARTWORKS.length) % ARTWORKS.length;
      var art = ARTWORKS[currentIndex];
      var img = document.getElementById('lightbox-img');
      img.src = art.src;
      img.alt = art.title;
      document.getElementById('lightbox-title').textContent = art.title;
    }

    function openLightbox(index) {
      showArtwork(index);
      document.getElementById('lightbox').classList.add('active');
    }

    function closeLightbox() {
      document.getElementById('lightbox').classList.remove('active');
    }

    function showPrev() { showArtwork(currentIndex - 1); }
    function showNext() { showArtwork(currentIndex + 1); }

    document.addEventListener('keydown', function (e) {
      if (!document.getElementById('lightbox').classList.contains('active')) return;
      if (e.key === 'Escape') closeLightbox();
      if (e.key === 'ArrowLeft') showPrev();
      if (e.key === 'ArrowRight') showNext();
    });
  </script>

</body>

</html>

<!DOCTYPE html>
<html lang="pt-BR" data-theme="black">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="DreamLab — página pessoal de Dryn.">
  <meta name="author" content="DrynWorks">
  <title>DreamLab — Home</title>
  <link rel="stylesheet" href="../style.css?v=1">
  <script src="../js/theme.js?v=1"></script>
</head>

<body class="frame-body">

  <div class="page-head" style="animation-delay: 0.04s;">
    <span class="page-title">HOME</span>
  </div>

  <div class="home-grid">

    <div class="window home-panel home-welcome" style="animation-delay: 0.08s;">
      <div class="window-header">
        <span class="window-title">Welcome</span>
      </div>
      <div class="window-body home-welcome-body">Welcome to DreamLab.</div>
    </div>

    <a href="gallery.html" class="window menu-option-card home-panel home-latest" style="animation-delay: 0.12s;">
      <div class="window-header">
        <span class="window-title">Latest</span>
        <span class="arrow-indicator">&rarr;</span>
      </div>
      <div class="home-latest-thumb">
        <img src="../images/IMG_8368.jpg" alt="Neon &amp; Kanji — arte mais recente da Gallery">
      </div>
    </a>

    <div class="window home-panel home-status" style="animation-delay: 0.16s;">
      <div class="window-header">
        <span class="window-title">Status</span>
      </div>
      <div class="window-body home-status-body">
        <span class="profile-status"><span class="status-dot"></span> Online.</span>
      </div>
    </div>

  </div>

</body>

</html>

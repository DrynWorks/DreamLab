<!DOCTYPE html>
<html lang="pt-BR" data-theme="gray">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="DreamLab — página pessoal de Dryn.">
  <meta name="author" content="DrynWorks">
  <title>DreamLab</title>
  <link rel="stylesheet" href="style.css">
  <script src="js/theme.js"></script>
  <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.5.1/jquery.min.js"></script>
</head>

<body class="splash-body">

  <div id="loading-bar"></div>
  <div class="desktop-bg"></div>

  <div class="splash-container">
    <div class="splash-dual-grid">

      <!-- Visualizador -->
      <div class="win95-window splash-media-window">
        <div class="win95-titlebar">
          <div class="win95-titlebar-title">Viewer</div>
          <div class="win95-titlebar-controls">
            <button class="win95-btn" aria-label="Minimize">_</button>
            <button class="win95-btn" aria-label="Maximize">&#9633;</button>
            <button class="win95-btn" aria-label="Close">&times;</button>
          </div>
        </div>
        <div class="win95-body media-body">
          <img
            src="images/Classy%20Issues%20Inspo%20by%20Mux%20Jasper%20%23muxjasper%20%23fivedoubleues%20%23luxury%20%23inspo%20%23classyissue.gif"
            alt="" class="moon-gif">
        </div>
      </div>

      <!-- Terminal -->
      <div class="win95-window splash-terminal-window">
        <div class="win95-titlebar">
          <div class="win95-titlebar-title" id="term-title">DRYNLAB</div>
          <div class="win95-titlebar-controls">
            <button class="win95-btn" aria-label="Minimize">_</button>
            <button class="win95-btn" aria-label="Maximize">&#9633;</button>
            <button class="win95-btn" aria-label="Close">&times;</button>
          </div>
        </div>
        <div class="win95-body terminal-body crt-overlay">
          <div id="terminal-output" class="terminal-content"></div>
          <div id="enter-button-wrapper" class="enter-button-wrapper"
            style="opacity: 0; pointer-events: none; transition: opacity 0.5s ease;">
            <a href="menu.html" class="win95-enter-button" id="enter-btn">[ ENTER ]</a>
          </div>
        </div>
      </div>

    </div>
  </div>

  <!-- Seletor de temas compacto -->
  <div data-theme-switcher data-compact></div>

  <script>
    // Sequência de digitação do terminal
    (function () {
      var lines = [
        "> boot sequence initialized...",
        "> checking system...",
        "> loading assets...",
        "> connecting...",
        "> connection established.",
        "> welcome."
      ];

      var lineIndex = 0;
      var charIndex = 0;

      function typeNext() {
        var output = document.getElementById('terminal-output');
        var enterWrapper = document.getElementById('enter-button-wrapper');
        if (!output) return;

        if (lineIndex < lines.length) {
          var currentText = lines[lineIndex];
          var el = document.getElementById('term-line-' + lineIndex);

          if (!el) {
            el = document.createElement('div');
            el.id = 'term-line-' + lineIndex;
            el.className = 'terminal-line';
            if (lineIndex === lines.length - 1) el.classList.add('highlight-line');
            output.appendChild(el);
          }

          if (charIndex < currentText.length) {
            el.textContent = currentText.substring(0, charIndex + 1);
            charIndex++;
            setTimeout(typeNext, 28);
          } else {
            lineIndex++;
            charIndex = 0;
            setTimeout(typeNext, 200);
          }
        } else {
          var cursor = document.createElement('span');
          cursor.className = 'terminal-cursor';
          output.appendChild(cursor);

          setTimeout(function () {
            if (enterWrapper) {
              enterWrapper.style.opacity = '1';
              enterWrapper.style.pointerEvents = 'auto';
            }
          }, 800);
        }
      }

      document.addEventListener('DOMContentLoaded', typeNext);
    })();

    // Enter em qualquer lugar entra no site
    document.addEventListener('keydown', function (e) {
      if (e.key === 'Enter') window.location.href = 'menu.html';
    });

    // Favicon gerado via canvas, seguindo as cores do tema
    (function () {
      function draw() {
        var css = getComputedStyle(document.documentElement);
        var bg = (css.getPropertyValue('--titlebar') || '#3f4247').trim();
        var fg = (css.getPropertyValue('--titlebar-text') || '#ffffff').trim();

        var c = document.createElement('canvas');
        c.width = 32;
        c.height = 32;
        var ctx = c.getContext('2d');
        ctx.fillStyle = bg;
        ctx.fillRect(0, 0, 32, 32);
        ctx.fillStyle = fg;
        ctx.font = 'bold 22px monospace';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText('D', 16, 17);

        var lnk = document.querySelector('link[rel="icon"]') || document.createElement('link');
        lnk.rel = 'icon';
        lnk.href = c.toDataURL();
        document.head.appendChild(lnk);
      }

      document.addEventListener('DOMContentLoaded', draw);
      document.addEventListener('click', function (e) {
        if (e.target.closest && e.target.closest('[data-set-theme]')) setTimeout(draw, 0);
      });
    })();

    // Glitch discreto no título do terminal
    (function () {
      var chars = ['░', '▒', '▓', '■', '◆', '≡'];
      setInterval(function () {
        var el = document.getElementById('term-title');
        if (!el) return;
        var text = 'DRYNLAB';
        var idx = Math.floor(Math.random() * text.length);
        var ch = chars[Math.floor(Math.random() * chars.length)];
        el.textContent = text.substring(0, idx) + ch + text.substring(idx + 1);
        setTimeout(function () { el.textContent = text; }, 110);
      }, 8000);
    })();
  </script>

  <script src="js/sakura.js"></script>

</body>

</html>
